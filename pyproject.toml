[project]
name = "kv-transfer-replication"
version = "0.0.1"
description = "CPU-scale replication of Heo et al. 2026, cross-model KV cache transfer (arXiv 2608.03893)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "datasets>=2.20",
    "numpy>=1.26",
    "safetensors>=0.4",
    "matplotlib>=3.8",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kvt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
